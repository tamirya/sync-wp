version: '3.7'

services:
  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: 'unless-stopped'
    networks:
      - backend

  server:
    build:
      context: ./
      target: production-build-stage
      dockerfile: Dockerfile
    container_name: server
    ports:
      - '3000:3000'
    env_file:
      - .env.production.local
    restart: 'unless-stopped'
    networks:
      - backend
    depends_on:
      - redis

  worker:
    build:
      context: ./
      target: production-build-stage
      dockerfile: Dockerfile
    container_name: worker
    command: node dist/worker.js
    env_file:
      - .env.production.local
    restart: 'unless-stopped'
    networks:
      - backend
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    restart: 'unless-stopped'
    networks:
      - backend
    volumes:
      - redis_data:/data

networks:
  backend:
    driver: bridge

volumes:
  data:
    driver: local
  redis_data:
    driver: local
