version: '3.7'

services:
  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: 'unless-stopped'
    networks:
      - backend

  db-init:
    build:
      context: ./
      target: production-build-stage
      dockerfile: Dockerfile
    container_name: db-init
    env_file:
      - .env.production.local
    command: node dist/scripts/sync-db.js
    restart: 'no'
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy

  server:
    build:
      context: ./
      target: production-build-stage
      dockerfile: Dockerfile
    container_name: server
    ports:
      - '5001:3000'
    env_file:
      - .env.production.local
    restart: 'unless-stopped'
    networks:
      - backend
    depends_on:
      db-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./
      target: production-build-stage
      dockerfile: Dockerfile
    container_name: worker
    command: node dist/worker.js
    env_file:
      - .env.production.local
    restart: 'unless-stopped'
    networks:
      - backend
    depends_on:
      db-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: mysql
    env_file:
      - .env.production.local
    restart: 'unless-stopped'
    networks:
      - backend
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    restart: 'unless-stopped'
    networks:
      - backend
    volumes:
      - redis_data:/data

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
